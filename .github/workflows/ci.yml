name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: riskguard
          POSTGRES_PASSWORD: riskguard
          POSTGRES_DB: riskguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riskguard -d riskguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://riskguard:riskguard@localhost:5432/riskguard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # From the lock, not from the pyproject extras. `pip install -e ".[...]"`
      # re-resolves against PyPI on every run, so CI would test a different
      # dependency set from the one the image ships — which is how mcp 2.0.0
      # reached production (see PR #3). --no-deps on the project install stops
      # pip re-resolving the extras and defeating the lock.
      - name: Install dependencies (locked)
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Verify lock satisfies pyproject constraints
        run: python scripts/check_lock.py ml api agent mcp dev

      - name: Lint
        run: ruff check app ml scripts tests

      # The postgres service starts empty. Nothing else creates the schema, so
      # every DB-backed test failed with `relation "customers" does not exist`
      # — it just never showed, because the Lint step failed first and the job
      # stopped there. Locally the tests pass against a Neon database whose
      # schema was created by hand long ago, which is why this stayed invisible.
      # The migration is idempotent (CREATE TABLE IF NOT EXISTS throughout).
      - name: Create database schema
        env:
          PGPASSWORD: riskguard
        run: |
          psql -h localhost -U riskguard -d riskguard \
            -v ON_ERROR_STOP=1 -f scripts/run_migration.sql

      # Model artifacts aren't committed (see .gitignore) — regenerate them
      # so the app lifespan (which loads RiskModel at startup) can run.
      - name: Generate dataset and train model artifacts
        run: |
          python ml/generate_dataset.py --rows 5000 --seed 42
          python ml/train.py

      - name: Run tests
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    # id-token: the AWS steps below assume riskguard-gha-deploy via GitHub OIDC,
    # so no long-lived AWS keys live in repo secrets.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Duplicated from the test job for job isolation; sharing via
      # actions/upload-artifact + download-artifact would avoid retraining
      # if build time becomes a concern. 25k rows (not the test job's 5k):
      # this is the model that ships to production on main.
      - name: Generate dataset and train model artifacts
        run: |
          pip install -e ".[ml]"
          python ml/generate_dataset.py --rows 25000 --seed 42
          python ml/train.py

      - name: Build image
        run: docker build -t riskguard-ai:ci .

      # Deploy: only on a push to main (i.e. a merged PR), never on PRs.
      - name: Configure AWS credentials (OIDC)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::924056189531:role/riskguard-gha-deploy
          aws-region: us-east-1

      - name: Log in to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # The task definition runs :latest, so pushing :latest + forcing a new
      # deployment is the whole rollout. :<sha> is pushed too so any past
      # build can be pinned for a rollback.
      - name: Push image and roll the ECS service
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/riskguard-ai
        run: |
          docker tag riskguard-ai:ci "$IMAGE:${{ github.sha }}"
          docker tag riskguard-ai:ci "$IMAGE:latest"
          docker push --all-tags "$IMAGE"
          aws ecs update-service --cluster riskguard-cluster \
            --service riskguard-ai --force-new-deployment > /dev/null
          aws ecs wait services-stable --cluster riskguard-cluster \
            --services riskguard-ai
